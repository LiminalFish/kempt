<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoreboard</title>
  <!-- External CSS -->
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/tasks.css">
  <link rel="stylesheet" href="/assets/css/scoreboard.css">
</head>
<body>

  <!-- Hamburger Menu -->
  <div class="hamburger" id="hamburger">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- Taskbar -->
  <div class="taskbar" id="taskbar">
    <button id="index-btn">Tasks</button>
    <button id="completed-btn" style="display:none">Completed</button>
    <button id="scoreboard-btn">Scoreboard</button>
    <button id="settings-btn">Settings</button>
  </div>

  <!-- Main content -->
  <div class="content-container">
    <h1 class="page-title" style="transform: translateX(-320px);">Scoreboard</h1>

    <!-- Container for scoreboard list -->
    <div id="scoreboard-container">
      <p id="loading-text">Loading group members...</p>
      <ul id="scoreboard-list"></ul>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/assets/js/script.js"></script>
  <script src="/assets/js/scoreboard.js"></script>

</body>
</html>
