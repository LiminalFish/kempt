<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Completed Tasks</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/tasks.css">
</head>
<body>

  <!-- Hamburger Menu -->
  <div class="hamburger" id="hamburger">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- Taskbar -->
  <div class="taskbar" id="taskbar">
    <button id="index-btn">Tasks</button>
    <button id="completed-btn">Completed</button>
    <button id="scoreboard-btn">Scoreboard</button>
    <button id="settings-btn">Settings</button>
  </div>

  <!-- Page Title -->
  <h1 class="page-title">Completed Tasks</h1>

  <!-- Task List -->
  <div id="tasks-container">
    <p style="color:white;">Loading completed tasks...</p>
  </div>
  
  <script src="/assets/js/script.js"></script>
  <script>
    document.getElementById('index-btn').onclick = () => window.location.href = '/';
    document.getElementById('completed-btn').onclick = () => window.location.href = '/completed';
    document.getElementById('scoreboard-btn').onclick = () => window.location.href = '/scoreboard';
    document.getElementById('settings-btn').onclick = () => window.location.href = '/settings';

    const container = document.getElementById('tasks-container');

    async function loadCompletedTasks() {
      try {
        const res = await fetch('http://localhost:8081/tasks/completed');
        if (!res.ok) throw new Error('Failed to fetch');
        const tasks = await res.json();

        container.innerHTML = '';

        if (tasks.length === 0) {
          container.innerHTML = '<p style="color:white;">No completed tasks yet.</p>';
          return;
        }

        tasks.forEach(task => {
          const div = document.createElement('div');
          div.className = "task-item";
          div.innerHTML = `
            <div class="task-content-wrapper">
              <div class="task-text">
                <h2>${task.title}</h2>
                <p>${task.description}</p>
              </div>
              <span style="color:lightgreen; font-weight:bold;">✔ Completed</span>
            </div>
          `;
          container.appendChild(div);
        });

      } catch (err) {
        console.error(err);
        container.innerHTML = '<p style="color:red;">Error loading completed tasks.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadCompletedTasks);
  </script>
</body>
</html>
