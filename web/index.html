<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task List</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/tasks.css">
</head>
<body>

  <!-- Hamburger Menu -->
  <div class="hamburger" id="hamburger">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- Taskbar -->
  <div class="taskbar" id="taskbar">
    <button id="index-btn">Tasks</button>
    <!-- TEMPORARILY HIDDEN -->
    <button id="completed-btn" style="display:none;">Completed</button>
    <button id="scoreboard-btn">Scoreboard</button>
    <button id="settings-btn">Settings</button>
  </div>

  <!-- Page Title -->
 <h1 class="page-title">Task List</h1>

  <!-- New Task Button -->
  <button id="new-task-btn" class="new-task-btn">+</button>

  <!-- New Task Panel (Modal) -->
  <div id="new-task-panel" class="modal-overlay">
    <div class="modal-content">
      <h2>New Task</h2>
      
      <!-- REVERTED: Removed Points and Due Date fields -->
      <label for="new-task-title">Title:</label>
      <input type="text" id="new-task-title" placeholder="Task title">

      <div class="modal-buttons">
        <button id="cancel-task-btn" class="btn-secondary">Cancel</button>
        <button id="save-task-btn" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <!-- Container for tasks -->
  <div id="tasks-container" class="tasks-container">
    <p id="loading-text" style="color:white;">Loading tasks...</p>
  </div>

  <script src="/assets/js/script.js"></script>
  <script>
    // --- Navigation ---
    document.getElementById('index-btn').onclick = () => window.location.href = '/';
    // The line below is still here, just in case you re-enable the button
    document.getElementById('completed-btn').onclick = () => window.location.href = '/completed';
    document.getElementById('scoreboard-btn').onclick = () => window.location.href = '/scoreboard';
    document.getElementById('settings-btn').onclick = () => window.location.href = '/settings';

    const container = document.getElementById('tasks-container');

    // --- Auth ---
    const AUTH_TOKEN = localStorage.getItem('AUTH_TOKEN');
    if (!AUTH_TOKEN) {
      window.location.href = '/settings';
    }

    // --- Due Date Formatter ---
    function formatDueDate(unixTimestamp) {
      if (!unixTimestamp || unixTimestamp <= 0) {
        return '';
      }

      const taskDate = new Date(unixTimestamp * 1000);
      const today = new Date();
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);

      const taskDateString = taskDate.toISOString().split('T')[0];
      const todayString = today.toISOString().split('T')[0];
      const tomorrowString = tomorrow.toISOString().split('T')[0];

      if (taskDateString === todayString) {
        return 'Today';
      }
      if (taskDateString === tomorrowString) {
        return 'Tomorrow';
      }

      const mm = String(taskDate.getMonth() + 1).padStart(2, '0');
      const dd = String(taskDate.getDate()).padStart(2, '0');
      const yyyy = taskDate.getFullYear();
      return `${mm}/${dd}/${yyyy}`;
    }

    // --- Load Tasks from API ---
    async function loadTasks() {
      try {
        const res = await fetch('http://127.0.0.1:8081/tasks', {
          headers: { 'auth': AUTH_TOKEN }
        });
        if (!res.ok) throw new Error('Failed to fetch task list');
        
        const response = await res.json();
        const taskIds = response.taskIDs;

        container.innerHTML = ''; 

        if (!taskIds || !taskIds.length) {
          container.innerHTML = `<p style="color:white;">No tasks available.</p>`;
          return;
        }

        const taskPromises = taskIds.map(id => {
          return fetch(`http://127.0.0.1:8081/tasks/${id}`, {
            headers: { 'auth': AUTH_TOKEN }
          })
            .then(res => {
              if (!res.ok) throw new Error(`Failed to fetch task ${id}`);
              return res.json();
            });
        });

        const tasks = await Promise.all(taskPromises);

        tasks.forEach(task => {
          const div = document.createElement('div');
          div.className = "task-item";
          div.dataset.id = task.id;

          div.innerHTML = `
            <div class="task-content-wrapper">
              <div class="task-main-info">
                <div class="task-text">
                  <h2>${task.title}</h2>
                  <p>${task.description}</p>
                </div>
                <span class="task-due-date">${formatDueDate(task.duedate)}</span>
              </div>
              <button class="complete-btn">&#10003;</button>
            </div>
          `;

          container.appendChild(div);
        });

      } catch (err) {
        console.error(err);
        if (container.innerHTML === '') {
            container.innerHTML = `<p style="color:red;">Error loading tasks.</p>`;
        }
      }
    }

    // --- Handle Task Clicks ---
    container.addEventListener('click', async (e) => {
      const taskItem = e.target.closest('.task-item');
      if (!taskItem) return;

      const taskId = taskItem.dataset.id;

      // --- TYPO FIX HERE ---
      // Changed 'contents' to 'contains'
      if (e.target.classList.contains('complete-btn')) {
        e.stopPropagation(); 
        try {
          const res = await fetch(`http://127.0.0.1:8081/tasks/${taskId}/delete`, {
            method: 'POST', 
            headers: { 'auth': AUTH_TOKEN }
          });

          if (!res.ok) {
            throw new Error('Failed to complete task on server');
          }

          taskItem.remove();
        } catch (err) {
          console.error(err);
          alert('Error: Could not complete task.'); 
        }
        return;
      }

      // This is the click-to-edit logic, it's still here:
      window.location.href = `/task/${taskId}`;
    });

    // --- Modal Elements & Logic ---
    const newTaskBtn = document.getElementById('new-task-btn');
    const newTaskPanel = document.getElementById('new-task-panel');
    const cancelTaskBtn = document.getElementById('cancel-task-btn');
    const saveTaskBtn = document.getElementById('save-task-btn');
    const newTaskTitle = document.getElementById('new-task-title');
    
    // REVERTED: Removed points and due date elements
    // const newTaskPoints = document.getElementById('new-task-points');
    // const newTaskDue = document.getElementById('new-task-due');

    function hideModal() {
      newTaskPanel.style.display = 'none';
      newTaskTitle.value = '';
      // REVERTED: Removed points and due date clearing
      // newTaskPoints.value = '0';
      // newTaskDue.value = '';
    }

    newTaskBtn.addEventListener('click', () => {
      newTaskPanel.style.display = 'flex';
    });
    cancelTaskBtn.addEventListener('click', hideModal);
    newTaskPanel.addEventListener('click', (e) => {
      if (e.target === newTaskPanel) {
        hideModal();
      }
    });

    // --- Save New Task ---
    saveTaskBtn.addEventListener('click', async () => {
      const title = newTaskTitle.value.trim();
      
      // REVERTZED: Removed points and due date logic
      // const points = parseInt(newTaskPoints.value, 10) || 0;
      // const dateString = newTaskDue.value;
      // let duedate = 0;
      // if (dateString) {
      //   duedate = Math.floor(new Date(dateString).getTime() / 1000);
      // }

      if (!title) {
        alert('Please enter a task title.');
        return;
      }

      try {
        const res = await fetch('http://127.0.0.1:8081/tasks/create', {
          method: 'POST',
          headers: {
            'auth': AUTH_TOKEN,
            'Content-Type': 'application/json'
          },
          // REVERTED: Body only contains title
          body: JSON.stringify({
            title: title
          })
        });

        if (!res.ok) {
          throw new Error('Failed to create task on server');
        }

        hideModal();
        await loadTasks(); // Refresh list

      } catch (err) {
        console.error(err);
        alert('Error: Could not create task.');
      }
    });

    document.addEventListener('DOMContentLoaded', loadTasks);
  </script>
</body>
</html>
