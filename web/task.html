<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Details</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/tasks.css">
  <link rel="stylesheet" href="/assets/css/task_details.css">
</head>
<body>

  <!-- Hamburger Menu -->
  <div class="hamburger" id="hamburger">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- Taskbar -->
  <div class="taskbar" id="taskbar">
    <button id="index-btn">Tasks</button>
    <button id="completed-btn" style="display:none">Completed</button>
    <button id="scoreboard-btn">Scoreboard</button>
    <button id="settings-btn">Settings</button>
  </div>

  <!-- Page Title -->
  <h1 class="page-title">Task Details</h1>

  <!-- Task Details Container -->
  <div id="task-details-container">
    <p id="loading-text" style="color:white;">Loading task details...</p>
  </div>

  <script src="/assets/js/script.js"></script>
  <script src="/assets/js/script.js"></script>
  <script src="/assets/js/script.js"></script>
  <script>
    // --- Navigation Buttons ---
    document.getElementById('index-btn').onclick = () => window.location.href = '/';
    document.getElementById('completed-btn').onclick = () => window.location.href = '/completed';
    document.getElementById('scoreboard-btn').onclick = () => window.location.href = '/scoreboard';
    document.getElementById('settings-btn').onclick = () => window.location.href = '/settings';

    const container = document.getElementById('task-details-container');
    const AUTH_TOKEN = localStorage.getItem('AUTH_TOKEN');

    // Extract task ID from path /task/{id}
    function getTaskIdFromURL() {
      const parts = window.location.pathname.split("/");
      return parts[parts.length - 1];
    }

    // --- HELPER: Convert UNIX timestamp to YYYY-MM-DD string ---
    function unixToDateString(unixTimestamp) {
      if (!unixTimestamp || unixTimestamp <= 0) return '';
      // Multiply by 1000 to convert seconds to milliseconds
      const date = new Date(unixTimestamp * 1000);
      return date.toISOString().split('T')[0];
    }

    // --- Load Task Details ---
    async function loadTaskDetails() {
      const id = getTaskIdFromURL();
      if (!id) {
        container.innerHTML = '<p style="color:red;">No task ID provided.</p>';
        return;
      }

      try {
        const res = await fetch(`http://127.0.0.1:8081/tasks/${id}`, {
          headers: {
            'auth': AUTH_TOKEN
          }
        });
        if (!res.ok) throw new Error('Failed to fetch task');
        const task = await res.json(); //

        // --- UPDATED HTML ---
        // Added "Points" input (type=number)
        // Added "Due Date" input (type=date) and used helper to set value
        container.innerHTML = `
          <div class="task-details-box">
            <label for="task-title">Title:</label>
            <input type="text" id="task-title" value="${task.title || ''}">

            <label for="task-desc">Description:</label>
            <textarea id="task-desc">${task.description || ''}</textarea>

            <label for="task-points">Points:</label>
            <input type="number" id="task-points" value="${task.points || 0}" min="0">

            <label for="task-due">Due Date:</label>
            <input type="date" id="task-due" value="${unixToDateString(task.duedate)}">

            <div class="buttons">
              <button id="save-btn"> Save Changes</button>
              <button id="back-btn"> Back to Tasks</button>
            </div>
            <p id="save-message" style="color:white; margin-top:10px;"></p>
          </div>
        `;

        // --- Back Button ---
        document.getElementById('back-btn').addEventListener('click', () => {
          window.location.href = '/';
        });

        // --- Save Button ---
        document.getElementById('save-btn').addEventListener('click', async () => {
          const msg = document.getElementById('save-message');
          msg.textContent = "Saving...";
          msg.style.color = "white";

          try {
            // --- UPDATED SAVE LOGIC ---
            const newTitle = document.getElementById('task-title').value;
            const newDesc = document.getElementById('task-desc').value;
            
            // Get Points value
            const newPoints = parseInt(document.getElementById('task-points').value, 10) || 0;
            
            // Get date string and convert to UNIX timestamp
            const dateString = document.getElementById('task-due').value;
            let newDueDate = 0;
            if (dateString) { // "YYYY-MM-DD"
              // Gets date at midnight in user's local timezone
              newDueDate = Math.floor(new Date(dateString).getTime() / 1000);
            }

            const fetchOptions = (body) => ({
              method: 'POST',
              headers: {
                'auth': AUTH_TOKEN,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(body)
            });

            // Added new fetch for "points" to Promise.all
            const promises = [
              fetch(`http://127.0.0.1:8081/tasks/${id}/title`, fetchOptions({ title: newTitle })),
              fetch(`http://127.0.0.1:8081/tasks/${id}/description`, fetchOptions({ description: newDesc })),
              fetch(`http://127.0.0.1:8081/tasks/${id}/duedate`, fetchOptions({ duedate: newDueDate })),
              fetch(`http://127.0.0.1:8081/tasks/${id}/points`, fetchOptions({ points: newPoints })) //
            ];

            const results = await Promise.all(promises);

            for (const res of results) {
              if (!res.ok) {
                const errorText = await res.text();
                throw new Error(`One or more fields failed to save: ${errorText}`);
              }
            }
            
            msg.textContent = "Changes saved successfully!";
            msg.style.color = "lightgreen";

          } catch (err) {
            console.error(err);
            msg.textContent = `Failed to save changes: ${err.message}`;
            msg.style.color = "red";
          }
        });

      } catch (err) {
        console.error(err);
        container.innerHTML = '<p style="color:red;">Error loading task details.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadTaskDetails);
  </script>
</body>
</html>
